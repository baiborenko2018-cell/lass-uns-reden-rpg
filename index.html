dass ...","ru":"При этом нельзя упускать из виду, что ..."},{"id":"core-0082","de":"Diese Einschätzung greift meines Erachtens zu kurz.","ru":"На мой взгляд, эта оценка слишком поверхностна."},{"id":"core-0083","de":"Ich würde zwischen zwei Aspekten unterscheiden.","ru":"Я бы различал два аспекта."},{"id":"core-0084","de":"Das wirft die Frage auf, inwiefern ...","ru":"Это поднимает вопрос, в какой степени ..."},{"id":"core-0085","de":"Unter bestimmten Voraussetzungen wäre das denkbar.","ru":"При определённых условиях это было бы возможно."},{"id":"core-0086","de":"Die Argumentation überzeugt mich nur teilweise.","ru":"Эта аргументация убеждает меня лишь отчасти."},{"id":"core-0087","de":"Es wäre voreilig, daraus Schlüsse zu ziehen.","ru":"Было бы поспешно делать из этого выводы."},{"id":"core-0088","de":"Dem ist grundsätzlich zuzustimmen, allerdings ...","ru":"С этим в принципе можно согласиться, однако ..."},{"id":"core-0089","de":"Entscheidend ist letztlich, wie man das umsetzt.","ru":"В конечном счёте решает то, как это реализуют."}]},{"id":"core-09","version":1,"title":"Konflikte & Verhandlung","tier":"C1","phrases":[{"id":"core-0090","de":"Lassen Sie uns zunächst die Erwartungen klären.","ru":"Давайте сначала проясним ожидания."},{"id":"core-0091","de":"Ich möchte einen möglichen Kompromiss ausloten.","ru":"Я хочу изучить возможный компромисс."},{"id":"core-0092","de":"So wie ich Sie verstehe, geht es Ihnen vor allem um ...","ru":"Как я вас понимаю, для вас главное — ..."},{"id":"core-0093","de":"Diesen Einwand halte ich für berechtigt.","ru":"Я считаю это возражение обоснованным."},{"id":"core-0094","de":"Ich würde gern auf einen Punkt zurückkommen.","ru":"Я хотел бы вернуться к одному моменту."},{"id":"core-0095","de":"Könnten wir uns auf einen Mittelweg einigen?","ru":"Можем ли мы договориться о компромиссе?"},{"id":"core-0096","de":"Das sollte nicht zulasten der Qualität gehen.","ru":"Это не должно происходить в ущерб качеству."},{"id":"core-0097","de":"Ich r Sicht die beste Lösung?","ru":"Какое решение было бы лучшим с твоей точки зрения?"},{"id":"work-b2-01-009","de":"Lass uns die nächsten Schritte festhalten.","ru":"Давай зафиксируем следующие шаги."}]}];
"use strict";
const KEY='lass-adventure-save-v6',OLD='lass_uns_reden_adventure_year_one_v4';
const stages=['Wortschatz','Satztraining','Sprechen','Boss Challenge'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
let packs=[],phrases=[],byId=new Map(),weeks=[],tab='home',topic=0,card=0,showTranslation=false,week=0,active=null,reviewId=null;
const fresh=()=>({version:6,xp:0,completed:[],known:[],review:{},journal:[],drafts:{},created:new Date().toISOString()});
let state=fresh();
function validPack(p){return p&&typeof p.id==='string'&&/^[a-z0-9-]+$/.test(p.id)&&Number.isInteger(p.version)&&p.version>0&&typeof p.title==='string'&&['B1','B2','C1'].includes(p.tier)&&Array.isArray(p.phrases)&&p.phrases.length>0&&p.phrases.every(x=>x&&typeof x.id==='string'&&/^[a-z0-9-]+$/.test(x.id)&&typeof x.de==='string'&&x.de.length>2&&typeof x.ru==='string'&&x.ru.length>0)}
async function init(){try{let ids=new Set();packs=EMBEDDED_PACKS;for(const p of packs){if(!validPack(p))throw Error('Неверный пакет '+p.id);for(const x of p.phrases){if(ids.has(x.id))throw Error('Повтор ID '+x.id);ids.add(x.id)}}phrases=packs.flatMap(p=>p.phrases.map(x=>({...x,pack:p.id,tier:p.tier})));byId=new Map(phrases.map(x=>[x.id,x]));weeks=Array.from({length:52},(_,i)=>({id:i,pack:Math.min(11,Math.floor(i*12/52)),round:i%4+1}));load();render()}catch(e){$('app').innerHTML=`<section class="panel"><h2>Ошибка загрузки</h2><p>${esc(e.message)}</p></section>`}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===6){state={...fresh(),...x};return}}catch{}try{let o=JSON.parse(localStorage.getItem(OLD));if(o&&Array.isArray(o.completed)&&Array.isArray(o.known)){let m=fresh();m.completed=o.completed.filter(Number.isInteger).filter(x=>x>=0&&x<208).map(x=>'quest-'+String(x).padStart(3,'0'));m.known=o.known.filter(Number.isInteger).filter(x=>x>=0&&x<120).map(x=>'core-'+String(x).padStart(4,'0'));m.xp=Number.isFinite(o.xp)&&o.xp>=0?o.xp:0;m.journal=Array.isArray(o.journal)?o.journal.slice(0,500):[];state=m;save();alert('Найдено сохранение v4/v5. Прогресс перенесён. Сделай резервную копию.');}}catch{}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Не удалось сохранить. Экспортируй резервную копию.')}updateHeader()}
function updateHeader(){let l=Math.floor(state.xp/100)+1;$('stats').textContent=`Level ${l} · ${state.xp} XP · ${phrases.length} Redemittel`;$('xpbar').style.width=(state.xp%100)+'%'}
function btn(label,fn,cl=''){return `<button class="btn ${cl}" data-action="${fn}">${label}</button>`}
function nav(t){if(active!==null){let d=$('draft');if(d){state.drafts['quest-'+String(active).padStart(3,'0')]=d.value;save()}}tab=t;active=null;render();scrollTo(0,0)}
function render(){updateHeader();document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('app').innerHTML=active!==null?questScreen():({home:home,map:mapView,words:wordsView,quests:questsView,profile:profile})[tab]();}
function completed(id){return state.completed.includes('quest-'+String(id).padStart(3,'0'))}
function currentQuest(){return Array.from({length:208},(_,i)=>i).find(i=>!completed(i))??207}
function due(){return Object.entries(state.review).filter(([id,v])=>byId.has(id)&&v&&v.due<=Date.now()).map(([id])=>id)}
function home(){let n=currentQuest(),boss=state.completed.filter(x=>Number(x.slice(6))%4===3).length;return `<section class="panel"><h1>🏰 Adventure Hub 3.1</h1><p>Dein Abenteuer beginnt! Übe Redemittel, sprich laut und besiege die Bosse.</p><div class="grid"><div class="tile"><b>${state.completed.length}/208</b>Quests</div><div class="tile"><b>${state.known.length}/${phrases.length}</b>Redemittel</div><div class="tile"><b>${boss}/52</b>Boss-Siege</div><div class="tile"><b>${due().length}</b>Wiederholen</div></div><p class="notice">Главная цель — свободно использовать выражения в разговоре. XP начисляются за подтверждённые действия; приложение не проверяет речь автоматически.</p>${btn('⚔️ Aktuelle Quest · Woche '+(Math.floor(n/4)+1),'next','primary block')}${btn('🔁 Wiederholung','review','block')}</section><section class="panel"><h2>📦 Content Library</h2><p>${packs.length} пакетов · ${phrases.length} выражений. Новые материалы подключаются через catalog.json без переписывания приложения.</p>${packs.map(p=>`<span class="chip">${esc(p.tier)} · ${esc(p.title)} (${p.phrases.length})</span>`).join('')}</section>`}
function mapView(){return `<section class="panel"><h2>🗺️ Weltkarte · 52 Wochen</h2><p class="map-intro">✦ DEINE REISE DURCH DREI REICHE ✦</p><p class="muted">B1 → B2 → C1. Каждая неделя: 4 миссии, включая босса.</p>${[['🟢 B1 · Alltag',0,17],['🟣 B2 · Gespräche',18,34],['🟡 C1 · Meisterschaft',35,51]].map(([title,a,b])=>`<h3>${title}</h3><div class="grid">${weeks.slice(a,b+1).map(w=>{let lock=w.id>0&&!completed(w.id*4-1);let done=[0,1,2,3].filter(j=>completed(w.id*4+j)).length;return `<button class="btn ${lock?'locked':''}" data-action="week:${w.id}" ${lock?'disabled':''}>${lock?'🔒':'⚔️'} Woche ${w.id+1}<br><small>${esc(packs[w.pack].title)} · ${done}/4</small></button>`}).join('')}</div>`).join('')}</section>`}
function wordsView(){let p=packs[topic],x=p.phrases[card%p.phrases.length];return `<section class="panel vocab-screen"><h2>📚 Wortschatz · ${esc(p.tier)}</h2><label class="small">Thema</label><select id="packSelect" class="field">${packs.map((a,i)=>`<option value="${i}" ${topic===i?'selected':''}>${esc(a.tier+' · '+a.title)}</option>`).join('')}</select><p class="small">Karte ${card%p.phrases.length+1}/${p.phrases.length} · ${p.phrases.filter(x=>state.known.includes(x.id)).length} gelernt</p><div class="phrase"><p class="de">${esc(x.de)}</p><p>Sprich laut nach und bilde einen eigenen Satz.</p>${btn('🔊 Anhören','speak:'+x.id)}${btn(showTranslation?'🙈 Verbergen':'🌍 Übersetzung','translate')}${showTranslation?`<p class="ru">${esc(x.ru)}</p>`:''}</div><div class="row">${btn('←','prev')}${btn(state.known.includes(x.id)?'✓ Gelernt':'✓ Laut gesagt','learn','primary')}${btn('→','nextcard')}</div><p class="small">Отметка «выучено» требует подтверждения: ты произнёс фразу и составил собственное предложение.</p></section>`}
function questsView(){let w=weeks[week],lock=week>0&&!completed(week*4-1);return `<section class="panel quest-board"><h2>⚔️ Woche ${week+1} · ${esc(packs[w.pack].title)}</h2><p class="muted">${esc(packs[w.pack].tier)} · Runde ${w.round}/4</p><select id="weekSelect" class="field">${weeks.map(x=>`<option value="${x.id}" ${week===x.id?'selected':''} ${x.id>0&&!completed(x.id*4-1)?'disabled':''}>Woche ${x.id+1} · ${esc(packs[x.pack].title)}</option>`).join('')}</select>${lock?'<p>🔒 Заверши предыдущую неделю.</p>':[0,1,2,3].map(j=>`<div class="tile" style="margin:9px 0"><h3>${completed(week*4+j)?'🏆':'⚔️'} ${stages[j]}</h3><p class="small">${['Lerne und sprich drei Redemittel.','Bilde eigene Sätze.','Erzähle frei über dein Leben.','Reagiere spontan auf eine schwierige Situation.'][j]}</p>${btn(completed(week*4+j)?'Wiederholen':'Quest starten','quest:'+(week*4+j),j===3?'primary':'')}</div>`).join('')}</section>`}
function questScreen(){let w=weeks[Math.floor(active/4)],stage=active%4,p=packs[w.pack],subset=Array.from({length:Math.min(5,p.phrases.length)},(_,i)=>p.phrases[(w.id*3+i)%p.phrases.length]);let prompts=['Wähle drei Redemittel. Erkläre ihre Bedeutung und sprich sie laut.','Bilde mindestens drei eigene Sätze mit diesen Redemitteln.','Erzähle von einer echten Situation aus deinem Alltag. Verwende mindestens drei Redemittel.','👑 Boss: Du musst in einem Gespräch deinen Standpunkt erklären, Rückfragen beantworten und einen Einwand entkräften.'];return `<section class="panel boss-screen"><h2>${stage===3?'👑 BOSS CHALLENGE':'⚔️ '+stages[stage]}</h2><p class="small">Woche ${w.id+1} · ${esc(p.tier)} · ${esc(p.title)}</p><p class="de">${prompts[stage]}</p><p class="muted">${stage===3?'Sprich möglichst 2–4 Minuten frei.':'Sprich laut. Benutze eigene Beispiele.'}</p><h3>Redemittel</h3>${subset.map(x=>`<p class="chip">${esc(x.de)}</p>`).join('')}<p>${btn('🔊 Anhören','speak:'+subset[0].id)}${btn(showTranslation?'🙈 Verbergen':'🌍 Übersetzung','translate')}</p>${showTranslation?subset.map(x=>`<p class="small">${esc(x.de)} — ${esc(x.ru)}</p>`).join(''):''}<label for="draft" class="small">Deine Antwort / Notizen</label><textarea id="draft" class="field" placeholder="Schreibe deine Antwort auf Deutsch ...">${esc(state.drafts['quest-'+String(active).padStart(3,'0')]||'')}</textarea>${btn('💾 Entwurf speichern','draft')}${btn('🎙️ Diktieren','dictate')}<p class="notice">Проверка свободной речи автоматизирована не полностью. Подтверждай только реально выполненное устное задание.</p>${btn(completed(active)?'✓ Bereits abgeschlossen':'✓ Quest bestätigt','complete','primary block')}${btn('← Zurück','back','block')}</section>`}
function profile(){let bosses=state.completed.filter(x=>Number(x.slice(6))%4===3).length;return `<section class="panel hero-profile"><h2>🏆 Heldenprofil & Quest-Log</h2><div class="grid"><div class="tile"><b>${state.xp}</b>XP</div><div class="tile"><b>${bosses}</b>Boss-Siege</div><div class="tile"><b>${state.completed.length}</b>Quests</div><div class="tile"><b>${state.known.length}</b>Redemittel</div></div><h3>Schatzkammer</h3>${[[1,'Erste Quest',state.completed.length],[10,'Wortjäger',state.known.length],[1,'Erster Boss',bosses],[13,'Bossjäger',bosses],[52,'Legende',bosses]].map(([n,t,v])=>`<span class="chip">${v>=n?'🏆':'🔒'} ${t}</span>`).join('')}<h3>💾 Speicherstand</h3><p class="small">Сохраняется в браузере этого устройства. Для защиты от потери данных экспортируй JSON перед обновлениями. Нет облачной синхронизации.</p>${btn('⬇️ Backup exportieren','export','primary')}<label class="btn">⬆️ Backup importieren<input id="importFile" type="file" accept="application/json" hidden></label>${btn('⚠️ Reset','reset')}<h3>Quest-Log</h3>${state.journal.slice(0,40).map(e=>`<div class="tile" style="margin:8px 0"><b style="font-size:14px">${esc(e.event)}</b><span class="small">${esc(e.detail)} · ${e.xp} XP · ${new Date(e.at).toLocaleDateString('ru-RU')}</span></div>`).join('')||'<p class="muted">Noch keine bestätigten Ergebnisse.</p>'}</section>`}
function eventLog(event,detail,xp){state.journal.unshift({at:new Date().toISOString(),event,detail,xp});state.journal=state.journal.slice(0,1000)}
function speech(id){let x=byId.get(id);if(!x||!('speechSynthesis'in window)){alert('Озвучивание недоступно');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.de);u.lang='de-DE';u.rate=.88;speechSynthesis.speak(u)}
function learn(){let x=packs[topic].phrases[card%packs[topic].phrases.length];if(!state.known.includes(x.id)){if(!confirm('Ты произнёс выражение и составил собственное предложение?'))return;state.known.push(x.id);state.review[x.id]={due:Date.now()+86400000,interval:1};state.xp+=2;eventLog('Redemittel gelernt',x.de,2);save()}card=(card+1)%packs[topic].phrases.length;showTranslation=false;render()}
function complete(){if(completed(active)){active=null;render();return}if(active>0&&!completed(active-1)){alert('Сначала предыдущая миссия.');return}if(!confirm('Ты действительно выполнил задание УСТНО?'))return;let id='quest-'+String(active).padStart(3,'0'),gain=[10,10,20,30][active%4];state.drafts[id]=$('draft')?.value||'';state.completed.push(id);state.xp+=gain;eventLog(stages[active%4],`Woche ${Math.floor(active/4)+1}`,gain);save();active=null;render()}
function review(){let ids=due();if(!ids.length){alert('Пока нет выражений для повторения.');return}reviewId=ids[0];showReview(false)}
function showReview(reveal){let x=byId.get(reviewId);$('app').innerHTML=`<section class="panel"><h2>🔁 Wiederholung</h2><p class="de">${reveal?esc(x.de):esc(x.ru)}</p><p>${reveal?'Удалось правильно вспомнить и произнести?':'Скажи немецкую фразу вслух по памяти.'}</p>${reveal?btn('Noch nicht','grade:no')+btn('Ja, sicher','grade:yes','primary')+btn('🔊 Anhören','speak:'+x.id):btn('Antwort zeigen','reveal','primary')}</section>`}
function grade(ok){let r=state.review[reviewId];r.interval=ok?Math.min(32,(r.interval||1)*2):1;r.due=Date.now()+r.interval*86400000;eventLog('Wiederholung',byId.get(reviewId).de,0);save();review()}
function exportSave(){let b=new Blob([JSON.stringify({app:'lass-uns-reden',version:6,state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='lass-adventure-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importSave(f){if(!f)return;try{if(f.size>5000000)throw Error('Файл слишком большой');let x=JSON.parse(await f.text());if(x.app!=='lass-uns-reden'||!x.state||!Array.isArray(x.state.completed)||!Array.isArray(x.state.known)||x.version!==6)throw Error('Неверный формат');if(!confirm('Заменить текущий прогресс? Сначала сделай экспорт.'))return;let a=x.state;state={...fresh(),xp:Number.isFinite(a.xp)&&a.xp>=0?a.xp:0,completed:[...new Set(a.completed.filter(v=>typeof v==='string'&&/^quest-\d{3}$/.test(v)&&Number(v.slice(6))<208))],known:[...new Set(a.known.filter(v=>byId.has(v)))],review:{},drafts:{},journal:Array.isArray(a.journal)?a.journal.slice(0,1000).filter(v=>v&&typeof v.event==='string'):[]};if(a.review&&typeof a.review==='object')for(let [id,v] of Object.entries(a.review))if(byId.has(id)&&v&&Number.isFinite(v.due)&&Number.isFinite(v.interval))state.review[id]={due:v.due,interval:v.interval};if(a.drafts&&typeof a.drafts==='object')for(let [id,v] of Object.entries(a.drafts))if(/^quest-\d{3}$/.test(id)&&typeof v==='string')state.drafts[id]=v.slice(0,10000);save();render();alert('Сохранение восстановлено')}catch(e){alert('Не удалось импортировать: '+e.message)}}
function reset(){if(confirm('Удалить весь прогресс?')&&confirm('Точно? Сначала сделай резервную копию.')){state=fresh();save();render()}}
function dictate(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('Используй микрофон клавиатуры Android.');return}let r=new R();r.lang='de-DE';r.onresult=e=>{let d=$('draft');if(d)d.value+=' '+e.results[0][0].transcript};r.onerror=()=>alert('Распознавание речи недоступно');r.start()}
document.addEventListener('click',e=>{let el=e.target.closest('[data-tab],[data-action]');if(!el)return;if(el.dataset.tab){nav(el.dataset.tab);return}let a=el.dataset.action||'';if(a==='next'){week=Math.floor(currentQuest()/4);active=currentQuest();showTranslation=false;render()}else if(a==='review')review();else if(a==='reveal')showReview(true);else if(a.startsWith('grade:'))grade(a==='grade:yes');else if(a.startsWith('speak:'))speech(a.slice(6));else if(a==='translate'){if(active!==null){let d=$('draft');if(d)state.drafts['quest-'+String(active).padStart(3,'0')]=d.value}showTranslation=!showTranslation;render()}else if(a==='prev'){card=(card+packs[topic].phrases.length-1)%packs[topic].phrases.length;showTranslation=false;render()}else if(a==='nextcard'){card=(card+1)%packs[topic].phrases.length;showTranslation=false;render()}else if(a==='learn')learn();else if(a.startsWith('week:')){week=+a.slice(5);tab='quests';render()}else if(a.startsWith('quest:')){active=+a.slice(6);showTranslation=false;render();scrollTo(0,0)}else if(a==='draft'){state.drafts['quest-'+String(active).padStart(3,'0')]=$('draft').value;save();alert('Черновик сохранён')}else if(a==='dictate')dictate();else if(a==='complete')complete();else if(a==='back'){active=null;render()}else if(a==='export')exportSave();else if(a==='reset')reset()});
document.addEventListener('change',e=>{if(e.target.id==='packSelect'){topic=+e.target.value;card=0;showTranslation=false;render()}else if(e.target.id==='weekSelect'){week=+e.target.value;render()}else if(e.target.id==='importFile')importSave(e.target.files[0])});
init();
</script></body></html>
